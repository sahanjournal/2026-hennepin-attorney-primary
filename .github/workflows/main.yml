name: Update Hennepin attorney results

on:
  schedule:
    # Update this schedule as needed
    - cron: "15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-election-results
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data directories
        run: mkdir -p data output

      - name: Run scraper notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute scraping.ipynb \
            --output scraping-executed.ipynb \
            --output-dir /tmp \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Validate output
        run: |
          test -s output/hennepin_attorney_2026.csv
          echo "Output created:"
          wc -l output/hennepin_attorney_2026.csv
          head -n 3 output/hennepin_attorney_2026.csv

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/hennepin_attorney_2026.csv

           if git diff --cached --quiet; then
              echo "Dataset has not changed."
            else
              UPDATED_AT=$(TZ="America/Chicago" date "+%Y-%m-%d %I:%M:%S %p %Z")

              echo "$UPDATED_AT" > output/last_updated.txt
              git add output/last_updated.txt

              git commit -m "Update election results: $UPDATED_AT"
              git push
          fi
